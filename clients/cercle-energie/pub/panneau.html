<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:700;src:url(../site/assets/fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../site/assets/fonts/montserrat-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden;font-family:M,sans-serif;background:transparent;color:#fff}
.logo{position:absolute;left:54px;background:#fff;border-radius:26px;padding:16px 26px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.logo img{width:230px;display:block}
.fade{position:absolute;left:0;right:0;height:220px;background:linear-gradient(to top,#07264B,rgba(7,38,75,0))}
.panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(160deg,#07264B,#0B3566 70%,#0E4C8A);padding:0 64px;overflow:hidden}
.ring{position:absolute;right:-220px;bottom:-260px;width:620px;height:620px;border-radius:50%;border:60px solid rgba(185,227,90,.16)}
.k{font-weight:700;font-size:30px;letter-spacing:.18em;text-transform:uppercase;color:#B9E35A;display:flex;align-items:center;gap:18px}
.k:before{content:"";width:64px;height:9px;border-radius:9px;background:linear-gradient(90deg,#73AF01,#01B7BA)}
h1{font-weight:800;line-height:1.04;letter-spacing:-.015em;margin-top:22px}
h1 em{font-style:normal;color:#B9E35A}
.cta{display:inline-flex;align-items:center;gap:16px;margin-top:34px;background:linear-gradient(95deg,#73AF01,#4E8A06);font-weight:800;font-size:40px;padding:26px 50px;border-radius:99px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.bar{position:absolute;left:64px;right:64px;height:8px;border-radius:8px;background:rgba(255,255,255,.16)}
.bar i{display:block;height:100%;border-radius:8px;background:#B9E35A}
</style></head><body>
<div class="logo" id="logo"><img src="../site/assets/img/logo_mark_t.png"></div>
<div class="fade" id="fade"></div>
<div class="panel" id="panel"><div class="ring"></div><div id="in" style="position:absolute;left:64px;right:64px"><div class="k" id="k"></div><h1 id="h"></h1><div class="cta" id="c" hidden></div></div><div class="bar" id="bar"><i id="bi"></i></div></div>
<script>const q=new URLSearchParams(location.search);const H=innerHeight,vh=+q.get('vh');
panel.style.height=(H-vh)+'px';fade.style.bottom=(H-vh)+'px';
const story=H>1500;logo.style.top=(story?270:48)+'px';
document.getElementById('in').style.top=(story?70:44)+'px';
k.textContent=q.get('k');h.innerHTML=q.get('h');h.style.fontSize=(story?86:62)+'px';
c.style.display='none';if(q.get('c')){c.style.display='inline-flex';c.textContent=q.get('c')+' →';if(!story){c.style.fontSize='30px';c.style.padding='18px 36px';c.style.marginTop='20px'}}
bar.style.bottom=(story?360:26)+'px';bi.style.width=(100*(+q.get('i')+1)/(+q.get('n')))+'%';</script></body></html>
