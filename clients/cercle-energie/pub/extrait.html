<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:700;src:url(../site/assets/fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../site/assets/fonts/montserrat-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden;font-family:M,sans-serif;color:#fff}body{background:linear-gradient(165deg,#07264B,#0B3566 60%,#0E4C8A)}
.ring{position:absolute;right:-260px;top:-300px;width:760px;height:760px;border-radius:50%;border:70px solid rgba(185,227,90,.15)}
.ring.b{right:auto;left:-300px;top:auto;bottom:-340px;border-color:rgba(1,183,186,.15)}
.logo{position:absolute;left:54px;background:#fff;border-radius:26px;padding:16px 26px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}.logo img{width:220px;display:block}
.top{position:absolute;left:64px;right:64px}
.k{font-weight:700;font-size:30px;letter-spacing:.18em;text-transform:uppercase;color:#B9E35A;display:flex;align-items:center;gap:18px}
.k:before{content:"";width:64px;height:9px;border-radius:9px;background:linear-gradient(90deg,#73AF01,#01B7BA)}
h1{font-weight:800;line-height:1.05;letter-spacing:-.015em;margin-top:20px}h1 em{font-style:normal;color:#B9E35A}
.hole{position:absolute;left:0;width:1080px;height:608px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.bot{position:absolute;left:64px;right:64px;text-align:left}
.cta{display:inline-flex;align-items:center;gap:16px;background:linear-gradient(95deg,#73AF01,#4E8A06);font-weight:800;padding:26px 50px;border-radius:99px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.sub{font-weight:700;color:#CFE0F3;margin-top:22px}
</style></head><body><div class="ring"></div><div class="ring b"></div>
<div class="logo" id="logo"><img src="../site/assets/img/logo_mark_t.png"></div>
<div class="top" id="tp"><div class="k" id="k"></div><h1 id="h"></h1></div>
<div class="hole" id="hole"></div>
<div class="bot" id="bot"><div class="cta" id="c"></div><div class="sub" id="s"></div></div>
<script>const q=new URLSearchParams(location.search),H=innerHeight,st=H>1500;const vy=+q.get('vy');
logo.style.top=(st?270:40)+'px';if(!st){logo.style.padding='12px 20px 9px';logo.querySelector('img').style.width='170px'}tp.style.top=(st?480:228)+'px';h.style.fontSize=(st?76:54)+'px';k.textContent=q.get('k');h.innerHTML=q.get('h');
hole.style.top=vy+'px';bot.style.top=(vy+608+(st?70:44))+'px';c.textContent=q.get('c')+' →';c.style.fontSize=(st?40:32)+'px';if(!st)c.style.padding='20px 40px';s.textContent=q.get('s');s.style.fontSize=(st?30:24)+'px'</script></body></html>
